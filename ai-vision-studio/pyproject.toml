[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-studio"
version = "0.1.0"
description = "AI Image Enhancer & Studio for Marginalized Artisans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "rembg>=2.0",
    "onnxruntime>=1.17",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vision-studio = "vision_studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_studio*"]
