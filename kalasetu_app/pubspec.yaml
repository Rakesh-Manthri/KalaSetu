name: kalasetu_app
description: "KalaSetu — AI-Driven Market Linkage & Smart Cataloging for Marginalized Artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Camera & Media
  camera: ^0.11.0+2
  record: ^5.2.1
  audioplayers: ^6.1.0

  # Local Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.2.0

  # UI / Utilities
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.8.2
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mock_products/
    - assets/images/placeholders/
